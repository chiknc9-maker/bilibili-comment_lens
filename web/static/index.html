<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评论透镜 · 评论区思辨分析</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#2b2b2b; --sub:#8a857a; --line:#e5e0d5; --accent:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 16px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font-size: 1.5rem; margin: 0 0 6px; }
  header p { color: var(--sub); margin: 0 0 28px; font-size: .9rem; }
  .input-row { display:flex; gap:10px; }
  input { flex:1; padding: 12px 14px; border:1px solid var(--line); border-radius:8px;
          font-size: .95rem; background:var(--card); outline:none; }
  input:focus { border-color: var(--accent); }
  button { padding: 12px 22px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-size:.95rem; cursor:pointer; white-space:nowrap; }
  button:disabled { background:#c9c2b5; cursor:not-allowed; }
  .hint { color:var(--sub); font-size:.8rem; margin-top:10px; }
  #status { margin: 28px 0 0; padding: 14px 16px; background:var(--card);
            border:1px solid var(--line); border-radius:8px; display:none; }
  #status.spin::before { content:"⏳ "; }
  #report { display:none; margin-top: 28px; padding: 28px 30px; background:var(--card);
            border:1px solid var(--line); border-radius:10px; }
  #report h1 { font-size: 1.35rem; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
  #report h2 { font-size: 1.12rem; margin-top: 2em; border-left: 4px solid var(--accent); padding-left: 10px; }
  #report h3 { font-size: 1rem; margin-top: 1.6em; }
  #report blockquote { margin: .8em 0; padding: 6px 14px; background: #faf7f0;
                       border-left: 3px solid var(--line); color:#555; }
  #report li { margin: .35em 0; }
  #report hr { border:0; border-top:1px solid var(--line); margin:2.2em 0; }
  .err { color: var(--accent); }
  .warn { background: #fdf3e3; border-color: #d9a441; color: #7a5b12; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>评论透镜</h1>
    <p>粘贴 B站争议视频链接，生成评论区思辨报告：争论地图 · 垃圾解剖 · 论证范本 · 社会学观察。分析论证质量，不评判立场。</p>
  </header>

  <div class="input-row">
    <input id="url" placeholder="粘贴视频链接或 BV 号，如 https://www.bilibili.com/video/BV1..." />
    <button id="go">开始分析</button>
  </div>
  <div class="hint">分析约需 2~6 分钟（抓取评论区 + AI 分析）。推荐直接访问 <b>http://127.0.0.1:8000/</b> 使用；双击文件打开也能用。</div>

  <details style="margin-top:12px; font-size:.85rem; color:var(--sub);">
    <summary style="cursor:pointer;">高级设置：填写自己的 API Key / 换模型（可选）</summary>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
      <input id="api_key" type="password" placeholder="API Key（sk-…；不填则用本机 .env 配置）" autocomplete="off">
      <input id="base_url" placeholder="API 地址（默认 https://api.deepseek.com，OpenAI 兼容服务可换）">
      <input id="model" placeholder="模型名（默认 deepseek-chat）">
      <p class="hint" style="margin:0;">Key 只保存在你自己的浏览器里，随每次请求发给本机服务，不上传任何第三方。</p>
    </div>
  </details>

  <div id="status"></div>
  <div id="report"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let pollTimer = null;
// 绝对地址：即使页面是直接双击打开（file://），请求也能到达本机服务
// 页面由本服务打开时用同源地址；双击文件打开时回退到固定端口
const API = location.protocol === "file:" ? "http://127.0.0.1:8000" : location.origin;
// 记住上次填写的配置（只存在本浏览器里）
$("api_key").value = localStorage.getItem("cl_api_key") || "";
$("base_url").value = localStorage.getItem("cl_base_url") || "";
$("model").value = localStorage.getItem("cl_model") || "";

$("go").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return;
  const body = { url };
  const key = $("api_key").value.trim(), base = $("base_url").value.trim(), model = $("model").value.trim();
  if (key) body.api_key = key;
  if (base) body.base_url = base;
  if (model) body.model = model;
  localStorage.setItem("cl_api_key", key);
  localStorage.setItem("cl_base_url", base);
  localStorage.setItem("cl_model", model);
  $("go").disabled = true;
  $("report").style.display = "none";
  $("status").style.display = "block";
  $("status").className = "spin";
  $("status").textContent = "提交中…";
  try {
    const r = await fetch(API + "/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      $("status").className = "err";
      $("status").textContent = "提交失败：" + (j.detail || r.status);
      $("go").disabled = false;
      return;
    }
    const { task_id } = await r.json();
    poll(task_id);
  } catch (e) {
    $("status").className = "err";
    $("status").textContent = "网络错误：" + e;
    $("go").disabled = false;
  }
};

function poll(taskId) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(`${API}/api/tasks/${taskId}`);
      if (!r.ok) return;
      const t = await r.json();
      $("status").className = "spin";
      $("status").textContent = t.message || t.status;
      if (t.status === "done") {
        clearInterval(pollTimer);
        loadReport(taskId, t);
      } else if (t.status === "error") {
        clearInterval(pollTimer);
        $("status").className = "err";
        $("go").disabled = false;
      }
    } catch (e) { /* 轮询失败静默，下轮继续 */ }
  }, 2000);
}

async function loadReport(taskId, task) {
  const r = await fetch(`${API}/api/tasks/${taskId}/report`);
  const j = await r.json();
  if (task && task.degraded) {
    $("status").textContent = "完成 ✅ 注意：本次分析发生降级（命题提取输出超限，已自动降档或抢救），报告覆盖偏窄，建议重新分析一次。";
    $("status").className = "warn";
  } else {
    $("status").textContent = "完成 ✅（报告内容若更新过，请重新分析获取最新快照）";
    $("status").className = "";
  }
  const report = $("report");
  report.style.display = "block";
  try {
    report.innerHTML = marked.parse(j.report_md);
  } catch (e) {
    // marked CDN 不可用时降级为纯文本
    report.innerHTML = "";
    const pre = document.createElement("pre");
    pre.style.whiteSpace = "pre-wrap";
    pre.textContent = j.report_md;
    report.appendChild(pre);
  }
  $("go").disabled = false;
  document.title = j.title + " · 评论透镜";
  report.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
